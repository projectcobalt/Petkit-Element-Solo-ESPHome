substitutions:
  name: element-solo
  friendly_name: Petkit Element Solo
  manufacturer: PETKIT
  model: D4-2
  product_code: P570
  max_scoops: "6"
  dispense_timeout: 20s
  anti_jam_reverse_time: 750ms
  anti_jam_settle_time: 250ms
  max_jam_retries: "2"
  rtc_timer_minutes: "60"
  adc_update_interval: 30s
  motor_pulse_lockout_ms: "500"
  time_zone: "Australia/Brisbane"
  sound_feed_start: "start:d=16,o=6,b=100:e,g"
  sound_feed_low_food: "lowfood:d=8,o=5,b=120:g,p,e,p,c"
  sound_feed_done: "done:d=16,o=6,b=100:g,e"
  sound_jam_recover: "jam:d=16,o=5,b=100:c,e,c"
  sound_jammed: "jammed:d=8,o=5,b=100:c,c,c"
  sound_wifi: "wifi:d=16,o=6,b=100:e"

esphome:
  min_version: 2026.9.1
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: true
  comment: "${manufacturer} Fresh Element Solo feeder, model ${model}, product code ${product_code}"
  project:
    name: projectcobalt.petkit-element-solo
    version: "2.0.0"
  on_boot:
    priority: 800
    then:
      - light.turn_on:
          id: status_led
          effect: fast_blink
      - pcf8563.read_time:
          id: rtc_time
      - delay: 250ms
      - lambda: |-
          if (id(persisted_feeder_state).empty()) {
            id(persisted_feeder_state) = "Idle";
          }
          if (id(persisted_feeder_state) == "Dispensing" ||
              id(persisted_feeder_state) == "Clearing jam") {
            id(persisted_feeder_state) = "Interrupted";
          }
          id(feed_active) = false;
          id(feeder_state).publish_state(id(persisted_feeder_state));
          id(food_state).publish_state(id(persisted_food_state));
          id(power_source).publish_state(id(battery_power_active).state ? "Battery" : "DC");
      - script.execute: read_rtc_status
    
esp32:
  board: esp32dev
  framework:
    type: esp-idf

wifi:
  ap:

captive_portal:

improv_serial:

dashboard_import:
  package_import_url: github://projectcobalt/petkit-element-solo/petkit-element-solo.yaml@main
  import_full_config: false
  
api:
  id: feeder_api
  actions:
    - action: feed
      variables:
        portions: int
      then:
        - if:
            condition:
              lambda: |-
                return portions < 1 || portions > ${max_scoops};
            then:
              - event.trigger:
                  id: feeder_event
                  event_type: feed_rejected
              - api.respond:
                  success: false
                  error_message: !lambda |-
                    char message[64];
                    snprintf(message, sizeof(message), "portions must be between 1 and %d", ${max_scoops});
                    return std::string(message);
            else:
              - if:
                  condition:
                    or:
                      - lambda: return id(feed_active);
                      - switch.is_on: feed_forward
                      - switch.is_on: feed_reverse
                  then:
                    - event.trigger:
                        id: feeder_event
                        event_type: feed_rejected
                    - api.respond:
                        success: false
                        error_message: "feeder is already dispensing"
                  else:
                    - script.execute:
                        id: dispense_scoops
                        scoops: !lambda return portions;
                    - api.respond:
                        data: !lambda |-
                          root["accepted"] = true;
                          root["portions"] = portions;


ota:
  - platform: web_server
  - platform: esphome

logger:
  level: INFO
  baud_rate: 115200
  hardware_uart: UART0

debug:

web_server:
  port: 80

# UART0 is exposed on the board's WiFi_TX0/WiFi_RX0 pads and is used by the
# logger and Improv Serial for factory provisioning.

i2c:
  sda:
    number: GPIO15
    ignore_strapping_warning: true
  scl: GPIO4
  scan: false

i2c_device:
  - id: rtc_raw
    address: 0x51

time:
  - platform: pcf8563
    id: rtc_time
    address: 0x51
    timezone: ${time_zone}
    update_interval: never
    on_time:
      - seconds: 0
        minutes: 0
        hours: 9
        then:
          - script.execute:
              id: check_food_warning
              reminder: true

  - platform: sntp
    id: sntp_time
    timezone: ${time_zone}
    servers:
      - 0.pool.ntp.org
      - 1.pool.ntp.org
      - 2.pool.ntp.org
    on_time_sync:
      then:
        - pcf8563.write_time:
            id: rtc_time
        - logger.log:
            level: WARN
            tag: rtc
            format: "Synced RTC from SNTP"
        - script.execute: read_rtc_status


output:
  # Board IO
  - platform: gpio
    id: status_led_output
    pin:
      number: GPIO5
      ignore_strapping_warning: true

  - platform: ledc
    id: rtttl_output
    pin: GPIO16

rtttl:
  output: rtttl_output

deep_sleep:
  id: feeder_deep_sleep
  wakeup_pin:
    number: GPIO34
    inverted: true
    allow_other_uses: true

light:
  - platform: binary
    id: status_led
    internal: true
    output: status_led_output
    effects:
      - strobe:
          name: fast_blink
          colors:
            - state: true
              duration: 125ms
            - state: false
              duration: 125ms
      - strobe:
          name: slow_blink
          colors:
            - state: true
              duration: 500ms
            - state: false
              duration: 500ms

event:
  # Refill requests are separate from feed outcomes so they cannot wake a meal waiter.
  - platform: template
    id: food_reserve_event
    name: Food Reserve Event
    icon: mdi:food
    event_types:
      - food_refill_needed

  - platform: template
    id: feeder_event
    name: Feeder Event
    icon: mdi:bell-badge-outline
    event_types:
      - feed_started
      - feed_completed
      - feed_rejected
      - anti_jam_started
      - feed_jammed

globals:
  - id: reserve_capacity
    type: float
    restore_value: true
    initial_value: "0"
  - id: reserve_calibration
    type: float
    restore_value: true
    initial_value: "0"
  - id: reserve_threshold
    type: float
    restore_value: true
    initial_value: "0"
  - id: reserve_remaining
    type: float
    restore_value: true
    initial_value: "0"
  - id: reserve_total
    type: float
    restore_value: true
    initial_value: "0"
  - id: reserve_since_refill
    type: float
    restore_value: true
    initial_value: "0"
  - id: reserve_known
    type: bool
    restore_value: true
    initial_value: "false"
  - id: reserve_threshold_initialized
    type: bool
    restore_value: true
    initial_value: "false"
  # Warning timing belongs to the device, including across reboots.
  - id: reserve_warning_sent
    type: bool
    restore_value: true
    initial_value: "false"
  - id: reserve_last_warning
    type: uint32_t
    restore_value: true
    initial_value: "0"
  - id: feed_calibration
    type: float
    initial_value: "0"
  - id: target_scoops
    type: int
    initial_value: "0"
  - id: scoops_count
    type: int
    initial_value: "0"
  - id: food_sensor_count
    type: int
    initial_value: "0"
  - id: last_motor_pulse_ms
    type: uint32_t
    initial_value: "0"
  - id: jam_retry_count
    type: int
    initial_value: "0"
  - id: feed_active
    type: bool
    initial_value: "false"
  - id: last_dispensed_scoops
    type: int
    restore_value: true
    initial_value: "0"
  - id: last_food_sensor_count
    type: int
    restore_value: true
    initial_value: "0"
  - id: persisted_feeder_state
    type: std::string
    restore_value: true
    initial_value: '"Idle"'
    max_restore_data_length: 24
  - id: persisted_food_state
    type: std::string
    restore_value: true
    initial_value: '"Unknown"'
    max_restore_data_length: 24

script:
  - id: check_food_warning
    parameters:
      reminder: bool
    then:
      - lambda: |-
          const bool low = id(reserve_known) && id(reserve_capacity) > 0 &&
              id(reserve_calibration) > 0 && id(reserve_remaining) <= id(reserve_threshold);
          if (!low) {
            if (id(reserve_warning_sent) || id(reserve_last_warning) != 0) {
              id(reserve_warning_sent) = false;
              id(reserve_last_warning) = 0;
              id(checkpoint_food_reserve).execute();
            }
            return;
          }
          const auto now = id(rtc_time).now();
          // An initial warning can work without valid time. Once time recovers,
          // anchor its reminder clock without sending the same warning again.
          if (id(reserve_warning_sent)) {
            if (!now.is_valid()) return;
            if (id(reserve_last_warning) == 0) {
              id(reserve_last_warning) = now.timestamp;
              id(checkpoint_food_reserve).execute();
              return;
            }
            if (!reminder || now.timestamp < id(reserve_last_warning) ||
                now.timestamp - id(reserve_last_warning) < 86400) return;
          }
          // Offline checks leave the warning due for the next connection.
          // State subscribers are normally HA; this is not a delivery receipt.
          if (!id(food_warning_connection_ready).state) return;
          id(reserve_warning_sent) = true;
          id(reserve_last_warning) = now.is_valid() ? now.timestamp : 0;
          id(checkpoint_food_reserve).execute();
          id(food_reserve_event).trigger("food_refill_needed");

  - id: checkpoint_food_reserve
    then:
      - lambda: |-
          reserve_capacity->update();
          reserve_calibration->update();
          reserve_threshold->update();
          reserve_remaining->update();
          reserve_total->update();
          reserve_since_refill->update();
          reserve_known->update();
          reserve_threshold_initialized->update();
          reserve_warning_sent->update();
          reserve_last_warning->update();
          if (!esphome::global_preferences->sync())
            id(food_tracking_command).publish_state("Storage save failed; check device logs");

  - id: food_change
    parameters:
      operation: string
      amount: float
    then:
      - lambda: |-
          const char *error = nullptr;
          if (id(feed_active)) error = "Feeding in progress; try again afterwards";
          else if (!std::isfinite(amount)) error = "Enter a finite amount";
          else if (operation == "capacity") {
            if (amount <= 0 || amount > 10000 ||
                (id(reserve_known) && amount < id(reserve_remaining)) ||
                amount < id(reserve_threshold))
              error = "Capacity must cover reserve and threshold, up to 10000 g";
            else {
              id(reserve_capacity) = amount;
              if (!id(reserve_threshold_initialized)) {
                id(reserve_threshold) = amount * 0.2f;
                id(reserve_threshold_initialized) = true;
              }
            }
          } else if (operation == "calibration") {
            if (amount <= 0 || amount > 100) error = "Calibration must be above 0 and at most 100 g";
            else id(reserve_calibration) = amount;
          } else if (id(reserve_capacity) <= 0) error = "Configure capacity first";
          else if (operation == "threshold") {
            if (amount < 0 || amount > id(reserve_capacity)) error = "Threshold must be between zero and capacity";
            else {
              id(reserve_threshold) = amount;
              id(reserve_threshold_initialized) = true;
            }
          } else if (id(reserve_calibration) <= 0) error = "Configure grams per portion first";
          else if (operation == "refill") {
            id(reserve_remaining) = id(reserve_capacity);
            id(reserve_known) = true;
            id(reserve_since_refill) = 0;
          } else if (operation == "topup") {
            if (!id(reserve_known)) error = "Record a full refill before topping up";
            else if (amount <= 0 || amount > id(reserve_capacity) - id(reserve_remaining))
              error = "Top-up must be positive and fit within capacity";
            else id(reserve_remaining) += amount;
          } else error = "Unknown food command";
          id(food_tracking_command).publish_state(error ? error : "Accepted");
          if (!error) id(checkpoint_food_reserve).execute();
      - script.execute: publish_food_reserve

  - id: publish_food_reserve
    mode: restart
    then:
      - lambda: |-
          id(food_capacity).publish_state(id(reserve_capacity));
          id(grams_per_portion).publish_state(id(reserve_calibration));
          id(low_food_threshold).publish_state(id(reserve_threshold));
          id(estimated_food_remaining).publish_state((id(reserve_known) ? id(reserve_remaining) : NAN));
          id(total_tracked_consumption).publish_state(id(reserve_total));
          id(consumption_since_full_refill).publish_state(id(reserve_since_refill));
          id(food_tracking_status).publish_state((id(reserve_capacity) <= 0 || id(reserve_calibration) <= 0 ? "Setup needed" : !id(reserve_known) ? "Reserve unknown" : id(reserve_remaining) <= id(reserve_threshold) ? "Low food" : "Tracking"));
          id(food_reserve_low).publish_state((id(reserve_known) && id(reserve_capacity) > 0 && id(reserve_calibration) > 0 && id(reserve_remaining) <= id(reserve_threshold)));
          id(food_reserve_ready).publish_state((id(reserve_known) && id(reserve_capacity) > 0 && id(reserve_calibration) > 0));
      - script.execute:
          id: check_food_warning
          reminder: false

  - id: play_rtttl
    parameters:
      song_str: string
    then:
      - if:
          condition:
            lambda: return !id(mute_sounds).state;
          then:
            - rtttl.play:
                rtttl: !lambda return song_str;

  - id: dispense_scoops
    parameters:
      scoops: int
    mode: single
    then:
      - if:
          condition:
            lambda: |-
              return scoops >= 1 &&
                     scoops <= ${max_scoops} &&
                     !id(feed_active) &&
                     !id(feed_forward).state &&
                     !id(feed_reverse).state;
          then:
            - lambda: |-
                id(feed_active) = true;
                id(feed_calibration) = id(reserve_calibration);
                id(target_scoops) = scoops;
                id(scoops_count) = 0;
                id(food_sensor_count) = 0;
                id(last_motor_pulse_ms) = 0;
                id(jam_retry_count) = 0;
                id(persisted_feeder_state) = "Dispensing";
                id(persisted_food_state) = "Checking";
                id(feeder_state).publish_state(id(persisted_feeder_state));
                id(food_state).publish_state(id(persisted_food_state));
                id(play_rtttl)->execute("${sound_feed_start}");
            - event.trigger:
                id: feeder_event
                event_type: feed_started
            - switch.turn_on: feed_forward
            - script.execute: dispense_watchdog
          else:
            - event.trigger:
                id: feeder_event
                event_type: feed_rejected

  - id: dispense_watchdog
    mode: restart
    then:
      - delay: ${dispense_timeout}
      - if:
          condition:
            switch.is_on: feed_forward
          then:
            - script.execute: anti_jam_recover

  - id: anti_jam_recover
    mode: single
    then:
      - switch.turn_off: feed_forward
      - if:
          condition:
            lambda: return id(jam_retry_count) < ${max_jam_retries};
          then:
            - lambda: |-
                id(jam_retry_count) += 1;
                id(persisted_feeder_state) = "Clearing jam";
                id(feeder_state).publish_state(id(persisted_feeder_state));
                id(play_rtttl)->execute("${sound_jam_recover}");
            - event.trigger:
                id: feeder_event
                event_type: anti_jam_started
            - switch.turn_on: feed_reverse
            - delay: ${anti_jam_reverse_time}
            - switch.turn_off: feed_reverse
            - delay: ${anti_jam_settle_time}
            - lambda: |-
                id(persisted_feeder_state) = "Dispensing";
                id(feeder_state).publish_state(id(persisted_feeder_state));
            - switch.turn_on: feed_forward
            - script.execute: dispense_watchdog
          else:
            - lambda: |-
                id(feed_active) = false;

                id(last_dispensed_scoops) = id(scoops_count);
                id(last_food_sensor_count) = id(food_sensor_count);
                id(persisted_feeder_state) = "Jammed";
                id(persisted_food_state) = "Unknown";
                id(feeder_state).publish_state(id(persisted_feeder_state));
                id(food_state).publish_state(id(persisted_food_state));
                id(last_feed_portions).publish_state(id(last_dispensed_scoops));
                id(food_drop_pulses).publish_state(id(last_food_sensor_count));
                id(play_rtttl)->execute("${sound_jammed}");
            - event.trigger:
                id: feeder_event
                event_type: feed_jammed

  - id: restart_wifi
    mode: restart
    then:
      - lambda: id(play_rtttl)->execute("${sound_wifi}");
      - wifi.disable:
      - delay: 3s
      - wifi.enable:

  - id: update_status_led
    mode: restart
    then:
      - if:
          condition:
            or:
              - switch.is_on: feed_forward
              - switch.is_on: feed_reverse
              - lambda: return id(feed_active);
          then:
            - light.turn_on:
                id: status_led
                effect: slow_blink
          else:
            - if:
                condition:
                  wifi.connected:
                then:
                  - light.turn_on:
                      id: status_led
                      effect: none
                else:
                  - light.turn_on:
                      id: status_led
                      effect: fast_blink
  
  - id: read_rtc_status
    mode: single
    then:
      - lambda: |-
          uint8_t cs2 = 0xFF;
          uint8_t timer_control = 0xFF;
          uint8_t timer_value = 0xFF;

          bool ok_cs2 = id(rtc_raw).read_byte(0x01, &cs2);
          bool ok_timer_control = id(rtc_raw).read_byte(0x0E, &timer_control);
          bool ok_timer_value = id(rtc_raw).read_byte(0x0F, &timer_value);

          if (!ok_cs2 || !ok_timer_control || !ok_timer_value) {
            ESP_LOGE("rtc", "RTC read failed");
            return;
          }

          bool tf = cs2 & 0x04;              // Timer flag
          bool tie = cs2 & 0x01;             // Timer interrupt enable
          bool te = timer_control & 0x80;    // Timer enable
          uint8_t td = timer_control & 0x03; // Timer clock select
          uint8_t tc_func = timer_control & 0x83;

          // ON only when the RTC confirms timer interrupt output is enabled,
          // countdown timer is enabled, and it is using the 1/60 Hz clock.
          bool interrupt_feedback = tie && te && (td == 3);

          id(rtc_timer_interrupt).publish_state(interrupt_feedback);

          char status[120];
          snprintf(
            status,
            sizeof(status),
            "CS2=0x%02X TCraw=0x%02X TCfunc=0x%02X TV=%u TF=%d TIE=%d TE=%d TD=%u",
            cs2,
            timer_control,
            tc_func,
            timer_value,
            tf,
            tie,
            te,
            td
          );
          ESP_LOGW("rtc", "%s", status);

          auto rtc_local = id(rtc_time).now();
          if (rtc_local.is_valid()) {
            ESP_LOGD(
              "rtc",
              "Local time %04u-%02u-%02u %02u:%02u:%02u",
              rtc_local.year,
              rtc_local.month,
              rtc_local.day_of_month,
              rtc_local.hour,
              rtc_local.minute,
              rtc_local.second
            );
          } else {
            ESP_LOGW("rtc", "Local time is not valid yet");
          }

  - id: disable_rtc_timer_interrupt
    mode: single
    then:
      - lambda: |-
          uint8_t cs2 = 0xFF;
          bool ok_read = id(rtc_raw).read_byte(0x01, &cs2);

          // Control_status_2 0x01: clear TF and disable TIE, preserving other bits.
          bool ok_cs2 = false;
          if (ok_read) {
            cs2 &= ~0x05;
            ok_cs2 = id(rtc_raw).write_byte(0x01, cs2);
          }

          // Timer_control 0x0E: clear TE to disable the countdown timer.
          bool ok_timer = id(rtc_raw).write_byte(0x0E, 0x00);

          ESP_LOGW("rtc", "Disabled RTC timer interrupt: CS2 read=%d write=%d Timer control ok=%d", ok_read, ok_cs2, ok_timer);
      - delay: 250ms
      - script.execute: read_rtc_status

  - id: enable_rtc_timer_interrupt
    mode: single
    then:
      - lambda: |-
          uint8_t minutes = ${rtc_timer_minutes};
          if (minutes < 1) {
            minutes = 1;
          }

          // Clear existing timer flag and disable interrupt before reconfiguring.
          uint8_t cs2 = 0xFF;
          bool ok_read = id(rtc_raw).read_byte(0x01, &cs2);
          bool ok_clear = false;
          if (ok_read) {
            cs2 &= ~0x05;
            ok_clear = id(rtc_raw).write_byte(0x01, cs2);
          }

          // Timer_value 0x0F. With TD=3, each count is 1 minute.
          bool ok_value = id(rtc_raw).write_byte(0x0F, minutes);

          // Timer_control 0x0E: TE=1 and TD=3 -> 1/60 Hz minute tick.
          bool ok_timer = id(rtc_raw).write_byte(0x0E, 0x83);

          // Control_status_2 0x01: set TIE and leave other status bits untouched.
          if (ok_read) {
            cs2 |= 0x01;
          }
          bool ok_cs2 = ok_read && id(rtc_raw).write_byte(0x01, cs2);

          ESP_LOGW("rtc", "Enabled RTC timer interrupt: minutes=%u clear ok=%d value ok=%d timer ok=%d CS2 ok=%d", minutes, ok_clear, ok_value, ok_timer, ok_cs2);
      - delay: 250ms
      - script.execute: read_rtc_status

  - id: sync_rtc_from_sntp
    mode: single
    then:
      - if:
          condition:
            lambda: |-
              return id(sntp_time).now().is_valid();
          then:
            - pcf8563.write_time:
                id: rtc_time
            - logger.log:
                level: WARN
                tag: rtc
                format: "Synced RTC from SNTP/system time"
            - delay: 250ms
            - script.execute: read_rtc_status
          else:
            - logger.log:
                level: WARN
                tag: rtc
                format: "SNTP/system time invalid, RTC sync skipped"

interval:
  - interval: 1s
    then:
      - script.execute: update_status_led
      - script.execute: publish_food_reserve

  - interval: 10min
    then:
      - script.execute: read_rtc_status

  - interval: 6h
    then:
      - script.execute: sync_rtc_from_sntp

binary_sensor:
  - platform: template
    id: food_warning_connection_ready
    internal: true
    lambda: return id(feeder_api).is_connected_with_state_subscription();
    filters:
      - delayed_on: 10s
    on_press:
      - script.execute:
          id: check_food_warning
          reminder: true

  - platform: template
    id: food_reserve_ready
    name: Food Reserve Ready
    entity_category: diagnostic
    lambda: |-
      return (id(reserve_known) && id(reserve_capacity) > 0 && id(reserve_calibration) > 0);

  - platform: template
    id: food_reserve_low
    name: Food Reserve Low
    device_class: problem
    lambda: |-
      return (id(reserve_known) && id(reserve_capacity) > 0 && id(reserve_calibration) > 0 && id(reserve_remaining) <= id(reserve_threshold));

  # Physical controls and production inputs
  - platform: gpio
    name: Manual Feed Button
    id: manual_feed_button
    icon: mdi:gesture-tap-button
    pin:
      number: GPIO34
      inverted: true
      allow_other_uses: true
    on_press:
      then:
        - if:
            condition:
              switch.is_off: child_lock
            then:
              - script.execute:
                  id: dispense_scoops
                  scoops: !lambda return (int) id(manual_dispense_scoops).state;
            else:
              - logger.log:
                  level: INFO
                  tag: child_lock
                  format: "Manual feed button ignored because child lock is enabled"

  - platform: gpio
    name: Motor Sensor
    id: motor_sensor
    icon: mdi:rotate-360
    pin:
      number: GPIO27
      inverted: true
    on_press:
      then:
        - lambda: |-
            if (!id(feed_active) || !id(feed_forward).state) {
              return;
            }

            const uint32_t now = millis();
            if (id(last_motor_pulse_ms) != 0 &&
                now - id(last_motor_pulse_ms) < ${motor_pulse_lockout_ms}) {
              return;
            }
            id(last_motor_pulse_ms) = now;

            id(scoops_count) += 1;
            // Count only accepted mechanical portions, including dry portions.
            if (id(feed_calibration) > 0) {
              id(reserve_total) += id(feed_calibration);
              id(reserve_since_refill) += id(feed_calibration);
              if (id(reserve_known))
                id(reserve_remaining) = std::max(0.0f, id(reserve_remaining) - id(feed_calibration));
              id(checkpoint_food_reserve).execute();
            }
            id(publish_food_reserve).execute();
            if (id(scoops_count) >= id(target_scoops)) {
              id(dispense_watchdog).stop();
              id(feed_forward).turn_off();
              id(feed_active) = false;

              id(last_dispensed_scoops) = id(scoops_count);
              id(last_food_sensor_count) = id(food_sensor_count);
              id(jam_retry_count) = 0;
              id(persisted_feeder_state) = "Idle";
              id(persisted_food_state) = id(last_food_sensor_count) > 0 ? "Food detected" : "Food not detected";
              id(feeder_state).publish_state(id(persisted_feeder_state));
              id(food_state).publish_state(id(persisted_food_state));
              id(last_feed_portions).publish_state(id(last_dispensed_scoops));
              id(food_drop_pulses).publish_state(id(last_food_sensor_count));
              // Completion at/below threshold uses a distinct, mute-aware tune.
              id(play_rtttl)->execute(id(food_reserve_low).state ?
                  "${sound_feed_low_food}" : "${sound_feed_done}");
              id(feeder_event).trigger("feed_completed");
            }

  - platform: gpio
    name: Food Optical Sensor
    id: food_optical_sensor
    icon: mdi:food-apple-outline
    pin: GPIO14
    on_press:
      then:
        - lambda: |-
            id(food_sensor_count) += 1;
            if (id(feed_active)) {
              id(persisted_food_state) = "Food detected";
              id(food_state).publish_state(id(persisted_food_state));
            }

  - platform: gpio
    id: wifi_button
    internal: true
    pin:
      number: GPIO0
      mode: INPUT
      inverted: true
      ignore_strapping_warning: true
    on_multi_click:
      - timing:
          - ON for at most 1s
          - OFF for at least 200ms
        then:
          - script.execute: restart_wifi
      - timing:
          - ON for 2s to 8s
          - OFF for at least 200ms
        then:
          - switch.toggle: wifi_control
      - timing:
          - ON for at least 10s
        then:
          - button.press: factory_reset_button

  - platform: gpio
    name: Battery Power Active
    id: battery_power_active
    icon: mdi:battery-charging
    device_class: power
    pin:
      number: GPIO21
      mode: INPUT
    filters:
      - delayed_on: 20ms
      - delayed_off: 20ms
    on_state:
      then:
        - text_sensor.template.publish:
            id: power_source
            state: !lambda |-
              return x ? "Battery" : "DC";

number:
  - platform: template
    id: food_top_up_amount
    name: Food Top Up Amount
    unit_of_measurement: g
    min_value: 0
    max_value: 10000
    step: 0.1
    mode: box
    optimistic: true
    initial_value: 0

  - platform: template
    id: food_capacity
    name: Food Capacity
    entity_category: config
    unit_of_measurement: g
    min_value: 0
    max_value: 10000
    step: 0.1
    mode: box
    update_interval: 1s
    lambda: return id(reserve_capacity);
    set_action:
      - script.execute:
          id: food_change
          operation: capacity
          amount: !lambda return x;

  - platform: template
    id: grams_per_portion
    name: Grams Per Portion
    entity_category: config
    unit_of_measurement: g
    min_value: 0
    max_value: 100
    step: 0.01
    mode: box
    update_interval: 1s
    lambda: return id(reserve_calibration);
    set_action:
      - script.execute:
          id: food_change
          operation: calibration
          amount: !lambda return x;

  - platform: template
    id: low_food_threshold
    name: Low Food Threshold
    entity_category: config
    unit_of_measurement: g
    min_value: 0
    max_value: 10000
    step: 0.1
    mode: box
    update_interval: 1s
    lambda: return id(reserve_threshold);
    set_action:
      - script.execute:
          id: food_change
          operation: threshold
          amount: !lambda return x;

  - platform: template
    id: manual_dispense_scoops
    name: Feed Portions
    icon: mdi:cup
    min_value: 1
    max_value: ${max_scoops}
    initial_value: 1
    optimistic: true
    restore_value: true
    step: 1
    mode: slider
    unit_of_measurement: scoops

switch:
  - platform: template
    id: child_lock
    name: Child Lock
    icon: mdi:account-lock
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: template
    id: mute_sounds
    name: Mute Sounds
    icon: mdi:volume-off
    entity_category: config
    optimistic: true

  - platform: template
    id: wifi_control
    name: WiFi Control
    icon: mdi:wifi
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - wifi.enable:
    turn_off_action:
      - wifi.disable:

  - platform: template
    id: rtc_timer_interrupt
    name: RTC Timer Interrupt
    icon: mdi:timer-alert-outline
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - script.execute: enable_rtc_timer_interrupt
    turn_off_action:
      - script.execute: disable_rtc_timer_interrupt

  - platform: gpio
    id: enable_sensors
    name: Sensor Power
    icon: mdi:leak
    entity_category: diagnostic
    disabled_by_default: true
    pin: GPIO33
    restore_mode: ALWAYS_ON

  - platform: gpio
    id: enable_feeder_motor
    name: Motor Enable
    icon: mdi:engine
    entity_category: diagnostic
    disabled_by_default: true
    pin: GPIO19
    restore_mode: ALWAYS_OFF

  - platform: gpio
    id: feed_forward
    pin: GPIO18
    restore_mode: ALWAYS_OFF
    internal: true
    interlock: &motor_interlock [feed_forward, feed_reverse]
    on_turn_on:
      then:
        - switch.turn_on: enable_feeder_motor
    on_turn_off:
      then:
        - switch.turn_off: enable_feeder_motor

  - platform: gpio
    id: feed_reverse
    pin: GPIO17
    restore_mode: ALWAYS_OFF
    internal: true
    interlock: *motor_interlock
    on_turn_on:
      then:
        - switch.turn_on: enable_feeder_motor
    on_turn_off:
      then:
        - switch.turn_off: enable_feeder_motor

sensor:
  - platform: template
    id: estimated_food_remaining
    name: Estimated Food Remaining
    unit_of_measurement: g
    accuracy_decimals: 1
    update_interval: never
    lambda: |-
      return (id(reserve_known) ? id(reserve_remaining) : NAN);

  - platform: template
    id: total_tracked_consumption
    name: Total Tracked Consumption
    unit_of_measurement: g
    accuracy_decimals: 1
    state_class: total_increasing
    update_interval: never
    lambda: return id(reserve_total);

  - platform: template
    id: consumption_since_full_refill
    name: Consumption Since Full Refill
    unit_of_measurement: g
    accuracy_decimals: 1
    update_interval: never
    lambda: return id(reserve_since_refill);

  - platform: template
    id: last_feed_portions
    name: Last Feed Portions
    icon: mdi:cup
    unit_of_measurement: portions
    accuracy_decimals: 0
    lambda: return id(last_dispensed_scoops);

  - platform: adc
    id: battery_pack_voltage
    name: Battery Pack Voltage
    pin: GPIO36
    icon: mdi:battery
    device_class: voltage
    state_class: measurement
    unit_of_measurement: V
    accuracy_decimals: 2
    attenuation: 12db
    update_interval: ${adc_update_interval}
    filters:
      - multiply: 3.0

  - platform: template
    id: battery_pack_level
    name: Battery Pack Level
    icon: mdi:battery-medium
    device_class: battery
    state_class: measurement
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: ${adc_update_interval}
    lambda: |-
      if (isnan(id(battery_pack_voltage).state)) {
        return NAN;
      }
      return id(battery_pack_voltage).state;
    filters:
      - calibrate_linear:
          method: exact
          datapoints:
            - 0.0 -> 0.0
            - 5.2 -> 0.0
            - 5.5 -> 1.0
            - 5.8 -> 10.0
            - 5.95 -> 20.0
            - 6.05 -> 30.0
            - 6.15 -> 40.0
            - 6.3 -> 50.0
            - 6.4 -> 60.0
            - 6.6 -> 70.0
            - 6.85 -> 80.0
            - 7.15 -> 90.0
            - 7.5 -> 100.0
      - clamp:
          min_value: 0
          max_value: 100

  - platform: adc
    name: DC Input Voltage
    pin: GPIO39
    icon: mdi:power-plug
    device_class: voltage
    state_class: measurement
    unit_of_measurement: V
    accuracy_decimals: 2
    attenuation: 12db
    update_interval: ${adc_update_interval}
    filters:
      - multiply: 3.0

  - platform: wifi_signal
    name: WiFi Signal
    entity_category: diagnostic
    update_interval: 60s

  - platform: template
    id: food_drop_pulses
    name: Food Drop Pulses
    icon: mdi:counter
    disabled_by_default: false
    accuracy_decimals: 0
    lambda: return id(last_food_sensor_count);

text_sensor:
  - platform: template
    id: food_tracking_status
    name: Food Tracking Status
    update_interval: never
    lambda: |-
      return {(id(reserve_capacity) <= 0 || id(reserve_calibration) <= 0 ? "Setup needed" : !id(reserve_known) ? "Reserve unknown" : id(reserve_remaining) <= id(reserve_threshold) ? "Low food" : "Tracking")};

  - platform: template
    id: food_tracking_command
    name: Food Tracking Command
    entity_category: diagnostic

  - platform: template
    id: feeder_state
    name: Feeder State
    icon: mdi:state-machine

  - platform: template
    id: food_state
    name: Food State
    icon: mdi:food-apple-outline

  - platform: debug
    reset_reason:
      name: Restart Reason
      icon: mdi:restart-alert
      entity_category: diagnostic

  - platform: template
    name: Device Time
    icon: mdi:clock-outline
    entity_category: diagnostic
    lambda: |-
      auto now = id(rtc_time).now();
      if (!now.is_valid()) {
        return {"Unknown"};
      }

      char time_string[20];
      snprintf(
        time_string,
        sizeof(time_string),
        "%04u-%02u-%02u %02u:%02u:%02u",
        now.year,
        now.month,
        now.day_of_month,
        now.hour,
        now.minute,
        now.second
      );
      return {time_string};

  - platform: template
    name: Power Source
    id: power_source
    icon: mdi:power-plug-battery
    entity_category: diagnostic

button:
  - platform: template
    id: food_record_top_up
    name: Food Record Top Up
    icon: mdi:food
    on_press:
      then:
        - script.execute:
            id: food_change
            operation: topup
            amount: !lambda return id(food_top_up_amount).state;

  - platform: template
    id: food_full_refill
    name: Food Full Refill
    icon: mdi:food
    on_press:
      then:
        - script.execute:
            id: food_change
            operation: refill
            amount: !lambda return 0;

  - platform: factory_reset
    id: factory_reset_button
    internal: true

  - platform: template
    name: Feed Now
    icon: mdi:food
    on_press:
      then:
        - script.execute:
            id: dispense_scoops
            scoops: !lambda return (int) id(manual_dispense_scoops).state;

  - platform: template
    name: Jog Motor Forward
    icon: mdi:rotate-right
    entity_category: diagnostic
    disabled_by_default: true
    on_press:
      then:
        - switch.turn_on: feed_forward
        - delay: 500ms
        - switch.turn_off: feed_forward

  - platform: template
    name: Jog Motor Reverse
    icon: mdi:rotate-left
    entity_category: diagnostic
    disabled_by_default: true
    on_press:
      then:
        - switch.turn_on: feed_reverse
        - delay: 500ms
        - switch.turn_off: feed_reverse

  - platform: restart
    name: Restart
    entity_category: diagnostic
