blueprint:
  name: Element Solo - Scheduled Feeding and Supervision
  description: 'Version 2.0.0.

    Schedule and supervise one ESPHome Element Solo feeder. Create one
    automation from this blueprint per feeder and put all its schedules here.
    The feeder owns low-food checks and reminder timing. This blueprint forwards
    its food_refill_needed events to the existing error-notification targets.

    '
  domain: automation
  author: projectcobalt
  source_url: https://github.com/projectcobalt/Petkit-Element-Solo/blob/main/blueprints/automation/element-solo-feeding.yaml
  homeassistant:
    min_version: 2026.7.0
  input:
    feeder:
      name: Feeder
      icon: mdi:food
      collapsed: false
      input:
        feeder_device:
          name: Feeder device
          description: Select the Element Solo feeder device that owns the Feed Now entity. The blueprint discovers its entities automatically; keep their default entity ID suffixes.
          selector:
            device:
              filter:
              - model: petkit-element-solo
              multiple: false
        native_feed_action:
          name: Native feed action
          description: 'Optional ESPHome action identifier, for example esphome.element_solo_abcdef_feed. Leave empty to retain legacy button feeding.'
          default: ''
          selector:
            text: {}
    schedule:
      name: Schedule
      icon: mdi:calendar-clock
      collapsed: false
      input:
        schedule_triggers:
          name: Feeding schedule
          description: Add one or more triggers that should request a feed.
          selector:
            trigger: {}
        feed_portions:
          name: Feed portions
          description: Number of portions requested for each schedule trigger.
          default: 1
          selector:
            number:
              min: 1.0
              max: 6.0
              step: 1.0
              mode: slider
              unit_of_measurement: portions
        feed_conditions:
          name: Additional feed conditions
          description: Optional conditions that must pass before a scheduled feed.
          default: []
          selector:
            condition: {}
        completion_timeout:
          name: Completion timeout
          description: 'Maximum time to wait for feed completion, rejection, or jam
            confirmation.

            '
          default:
            minutes: 2
          selector:
            duration: {}
    warnings:
      name: Warning thresholds
      icon: mdi:alert-outline
      collapsed: true
      input:
        low_battery_voltage:
          name: Low battery voltage
          description: Notify when battery voltage remains below this value.
          default: 5.5
          selector:
            number:
              min: 0.0
              max: 10.0
              step: 0.1
              mode: box
              unit_of_measurement: V
        warning_delay:
          name: Power warning delay
          description: Require the power condition to persist before notifying.
          default:
            minutes: 5
          selector:
            duration: {}
    notifications:
      name: Notifications
      icon: mdi:bell-outline
      collapsed: true
      input:
        error_notify_targets:
          name: Error notification targets
          description: Notify these targets for failed, rejected, jammed, or unconfirmed
            feeds.
          default: []
          selector:
            entity:
              filter:
              - domain:
                - notify
              multiple: true
        warning_notify_targets:
          name: Power warning notification targets
          description: Notify these targets for DC loss or low battery warnings.
          default: []
          selector:
            entity:
              filter:
              - domain:
                - notify
              multiple: true
        success_notify_targets:
          name: Success notification targets
          description: Optionally notify these targets after a verified feed.
          default: []
          selector:
            entity:
              filter:
              - domain:
                - notify
              multiple: true
# Keep short alert runs independent of scheduled-feed confirmation waits.
mode: parallel
max: 20
max_exceeded: silent
trigger_variables:
  feeder_device: !input feeder_device
  low_battery_voltage: !input low_battery_voltage
  native_feed_action: !input native_feed_action
variables:
  feeder_device: !input feeder_device
  feeder_name: '{{ device_attr(feeder_device, ''name_by_user'') or device_attr(feeder_device,
    ''name'') or ''Petkit Element Solo'' }}'
  feed_now: '{{ device_entities(feeder_device) | select(''match'', ''^button\..*_feed_now$'')
    | list | first | default('''') }}'
  feed_portions_entity: '{{ device_entities(feeder_device) | select(''match'', ''^number\..*_feed_portions$'')
    | list | first | default('''') }}'
  feeder_event: '{{ device_entities(feeder_device) | select(''match'', ''^event\..*_feeder_event$'')
    | list | first | default('''') }}'
  feeder_state: '{{ device_entities(feeder_device) | select(''match'', ''^(sensor|text_sensor)\..*_feeder_state$'')
    | list | first | default('''') }}'
  last_feed_portions: '{{ device_entities(feeder_device) | select(''match'', ''^sensor\..*_last_feed_portions$'')
    | list | first | default('''') }}'
  food_drop_pulses: '{{ device_entities(feeder_device) | select(''match'', ''^sensor\..*_food_drop_pulses$'')
    | list | first | default('''') }}'
  battery_power_active: '{{ device_entities(feeder_device) | select(''match'', ''^binary_sensor\..*_battery_power_active$'')
    | list | first | default('''') }}'
  battery_voltage: '{{ device_entities(feeder_device) | select(''match'', ''^sensor\..*_battery_pack_voltage$'')
    | list | first | default('''') }}'
  error_notify_targets: !input error_notify_targets
  warning_notify_targets: !input warning_notify_targets
  success_notify_targets: !input success_notify_targets
  feed_portions: !input feed_portions
  low_battery_voltage: !input low_battery_voltage
  native_feed_action: !input native_feed_action
  low_food_threshold: "{{ device_entities(feeder_device) | select('match', '^number\\..*_low_food_threshold$') | list | first | default('') }}"
  estimated_food_remaining: "{{ device_entities(feeder_device) | select('match', '^sensor\\..*_estimated_food_remaining$') | list | first | default('') }}"
triggers:
- triggers: !input schedule_triggers
# Native event trigger listens only to the selected device; no HA timing helper.
- trigger: event.received
  target:
    device_id: !input feeder_device
  options:
    event_type:
      - food_refill_needed
  id: food_refill_needed
- trigger: template
  value_template: >-
    {% set battery_power_active = device_entities(feeder_device)
       | select('match', '^binary_sensor\..*_battery_power_active$')
       | list | first | default('') %}
    {{ battery_power_active != '' and is_state(battery_power_active, 'on') }}
  for: !input warning_delay
  id: battery_power
- trigger: template
  value_template: >-
    {% set battery_voltage = device_entities(feeder_device)
       | select('match', '^sensor\..*_battery_pack_voltage$')
       | list | first | default('') %}
    {{ battery_voltage != '' and
       states(battery_voltage) not in ['unknown', 'unavailable'] and
       states(battery_voltage) | float(999) < low_battery_voltage | float }}
  for: !input warning_delay
  id: low_battery
- trigger: template
  value_template: >-
    {% set feeder_event = device_entities(feeder_device)
       | select('match', '^event\..*_feeder_event$')
       | list | first | default('') %}
    {{ states(feeder_event) if feeder_event != '' and
       state_attr(feeder_event, 'event_type') == 'feed_jammed' else false }}
  id: feeder_jammed
- trigger: template
  value_template: >-
    {% set feeder_event = device_entities(feeder_device)
       | select('match', '^event\..*_feeder_event$')
       | list | first | default('') %}
    {{ states(feeder_event) if feeder_event != '' and
       state_attr(feeder_event, 'event_type') == 'feed_rejected' else false }}
  id: feeder_rejected
actions:
# Preserve the former single-mode admission for legacy feeding and global
# outcome alerts. This is a conservative compatibility gate, not a mutex.
- condition: template
  value_template: >-
    {{ this.attributes.current | int(0) == 0 or
       (trigger is defined and trigger.id in
        ['food_refill_needed']) or
       (native_feed_action != '' and
        (trigger is not defined or trigger.id not in ['feeder_jammed', 'feeder_rejected'])) }}
- choose:
  - conditions:
    - condition: trigger
      id: food_refill_needed
    sequence:
    - condition: template
      value_template: '{{ error_notify_targets | count > 0 }}'
    - action: notify.send_message
      target:
        entity_id: !input error_notify_targets
      data:
        title: '{{ feeder_name }} refill needed'
        message: >-
          {{ feeder_name }} requests a food refill.
          {% if is_number(states(estimated_food_remaining)) and is_number(states(low_food_threshold)) %}
          Estimated food remaining: {{ states(estimated_food_remaining) | float | round(1) }} g;
          refill threshold: {{ states(low_food_threshold) | float | round(1) }} g.
          {% endif %}
          Refill the hopper and record the refill on the feeder.
  - conditions:
    - condition: trigger
      id: battery_power
    sequence:
    - variables:
        notification_title: '{{ feeder_name }} power warning'
        notification_message: '{{ feeder_name }} is running on battery power. Check
          its DC power supply.

          '
    - choose:
      - conditions: '{{ warning_notify_targets | count > 0 }}'
        sequence:
        - action: notify.send_message
          target:
            entity_id: !input warning_notify_targets
          data:
            title: '{{ notification_title }}'
            message: '{{ notification_message }}'
  - conditions:
    - condition: trigger
      id: low_battery
    sequence:
    - variables:
        notification_title: '{{ feeder_name }} low battery'
        notification_message: '{{ feeder_name }} battery voltage is {{ states(battery_voltage)
          }} V, below the configured {{ low_battery_voltage }} V threshold.

          '
    - choose:
      - conditions: '{{ warning_notify_targets | count > 0 }}'
        sequence:
        - action: notify.send_message
          target:
            entity_id: !input warning_notify_targets
          data:
            title: '{{ notification_title }}'
            message: '{{ notification_message }}'
  - conditions:
    - condition: trigger
      id: feeder_jammed
    sequence:
    - variables:
        notification_title: '{{ feeder_name }} jammed'
        notification_message: '{{ feeder_name }} could not complete a feed after its
          anti-jam retries. Check the dispensing mechanism.

          '
    - choose:
      - conditions: '{{ error_notify_targets | count > 0 }}'
        sequence:
        - action: notify.send_message
          target:
            entity_id: !input error_notify_targets
          data:
            title: '{{ notification_title }}'
            message: '{{ notification_message }}'
  - conditions:
    - condition: trigger
      id: feeder_rejected
    sequence:
    - variables:
        notification_title: '{{ feeder_name }} feed rejected'
        notification_message: '{{ feeder_name }} rejected a feed request because it
          was invalid or the feeder was already busy.

          '
    - choose:
      - conditions: '{{ error_notify_targets | count > 0 }}'
        sequence:
        - action: notify.send_message
          target:
            entity_id: !input error_notify_targets
          data:
            title: '{{ notification_title }}'
            message: '{{ notification_message }}'
  default:
  - condition: and
    conditions: !input feed_conditions
  - choose:
    - conditions: "{{ feed_now == '' or feed_portions_entity == '' or\n   states(feeder_event)
        in ['unknown', 'unavailable'] or\n   states(feeder_state) in ['unknown', 'unavailable']
        or\n   states(last_feed_portions) in ['unknown', 'unavailable'] or\n   states(food_drop_pulses)
        in ['unknown', 'unavailable'] }}\n"
      sequence:
      - variables:
          notification_title: '{{ feeder_name }} unavailable'
          notification_message: '{{ feeder_name }} could not be reached, so the scheduled
            feed was not attempted.

            '
      - choose:
        - conditions: '{{ error_notify_targets | count > 0 }}'
          sequence:
          - action: notify.send_message
            target:
              entity_id: !input error_notify_targets
            data:
              title: '{{ notification_title }}'
              message: '{{ notification_message }}'
      - stop: Feeder entities are unavailable
    - conditions: '{{ states(feeder_state) in [''Dispensing'', ''Clearing jam''] }}

        '
      sequence:
      - variables:
          notification_title: '{{ feeder_name }} feed skipped'
          notification_message: '{{ feeder_name }} is already {{ states(feeder_state)
            | lower }}, so the scheduled feed was skipped.

            '
      - choose:
        - conditions: '{{ error_notify_targets | count > 0 }}'
          sequence:
          - action: notify.send_message
            target:
              entity_id: !input error_notify_targets
            data:
              title: '{{ notification_title }}'
              message: '{{ notification_message }}'
      - stop: Feeder is busy
    - conditions: '{{ states(feeder_state) == ''Jammed'' }}'
      sequence:
      - variables:
          notification_title: '{{ feeder_name }} is jammed'
          notification_message: '{{ feeder_name }} has an unresolved jam, so the scheduled
            feed was not attempted.

            '
      - choose:
        - conditions: '{{ error_notify_targets | count > 0 }}'
          sequence:
          - action: notify.send_message
            target:
              entity_id: !input error_notify_targets
            data:
              title: '{{ notification_title }}'
              message: '{{ notification_message }}'
      - stop: Feeder is jammed
  - variables:
      previous_feeder_event_state: '{{ states(feeder_event) if feeder_event != ''''
        else '''' }}'
      feed_acceptance: {}
  - choose:
    - conditions: '{{ native_feed_action != "" }}'
      sequence:
      - action: '{{ native_feed_action }}'
        data:
          portions: '{{ feed_portions | int }}'
        response_variable: feed_acceptance
        continue_on_error: true
      - choose:
        - conditions: '{{ feed_acceptance is not mapping or not feed_acceptance.get("accepted", false) }}'
          sequence:
          - choose:
            - conditions: '{{ error_notify_targets | count > 0 }}'
              sequence:
              - action: notify.send_message
                target:
                  entity_id: !input error_notify_targets
                data:
                  title: '{{ feeder_name }} feed not accepted or confirmed'
                  message: '{{ feeder_name }} did not confirm acceptance of the scheduled request for {{ feed_portions | int }} portions. The feeder may be busy, may have rejected the request, or its connection may have failed. Check its state and last feed before retrying; no automatic retry was started.'
                continue_on_error: true
          - stop: Native feed request was not accepted; no outcome waiter is started
    default:
    - action: number.set_value
      target:
        entity_id: '{{ feed_portions_entity }}'
      data:
        value: '{{ feed_portions | int }}'
    - action: button.press
      target:
        entity_id: '{{ feed_now }}'
      continue_on_error: true
  - wait_for_trigger:
    - trigger: template
      value_template: "{{ feeder_event != '' and\n   states(feeder_event) != previous_feeder_event_state
        and\n   state_attr(feeder_event, 'event_type') in\n   ['feed_completed',
         'feed_jammed'] + (['feed_rejected'] if native_feed_action == '' else []) }}"
    timeout: !input completion_timeout
    continue_on_timeout: true
  - variables:
      result_event: '{{ ''timeout'' if wait.trigger is none else state_attr(feeder_event,
        ''event_type'') | default(''unknown'') }}

        '
  - choose:
    - conditions: '{{ result_event == ''feed_completed'' }}'
      sequence:
      - delay: 00:00:01
      - variables:
          reported_portions: '{{ states(last_feed_portions) | int(0) }}'
          reported_food_pulses: '{{ states(food_drop_pulses) | int(0) }}'
      - choose:
        - conditions: '{{ (reported_portions | int) != (feed_portions | int) }}

            '
          sequence:
          - variables:
              notification_title: '{{ feeder_name }} portion mismatch'
              notification_message: '{{ feeder_name }} reported {{ reported_portions
                }} portions after a request for {{ feed_portions | int }}.

                '
          - choose:
            - conditions: '{{ error_notify_targets | count > 0 }}'
              sequence:
              - action: notify.send_message
                target:
                  entity_id: !input error_notify_targets
                data:
                  title: '{{ notification_title }}'
                  message: '{{ notification_message }}'
        - conditions: '{{ (reported_food_pulses | int) <= 0 }}'
          sequence:
          - variables:
              notification_title: '{{ feeder_name }} food not detected'
              notification_message: '{{ feeder_name }} completed {{ reported_portions
                }} portions but detected no food drops. Check the hopper and chute.

                '
          - choose:
            - conditions: '{{ error_notify_targets | count > 0 }}'
              sequence:
              - action: notify.send_message
                target:
                  entity_id: !input error_notify_targets
                data:
                  title: '{{ notification_title }}'
                  message: '{{ notification_message }}'
        default:
        - variables:
            notification_title: '{{ feeder_name }} feed completed'
            notification_message: '{{ feeder_name }} completed {{ reported_portions
              }} portions and detected {{ reported_food_pulses }} food drop pulses.

              '
        - choose:
          - conditions: '{{ success_notify_targets | count > 0 }}'
            sequence:
            - action: notify.send_message
              target:
                entity_id: !input success_notify_targets
              data:
                title: '{{ notification_title }}'
                message: '{{ notification_message }}'
    - conditions: '{{ result_event == ''feed_jammed'' }}'
      sequence:
      - variables:
          notification_title: '{{ feeder_name }} jammed'
          notification_message: '{{ feeder_name }} could not complete the scheduled
            feed after its anti-jam retries. Check the dispensing mechanism.

            '
      - choose:
        - conditions: '{{ error_notify_targets | count > 0 }}'
          sequence:
          - action: notify.send_message
            target:
              entity_id: !input error_notify_targets
            data:
              title: '{{ notification_title }}'
              message: '{{ notification_message }}'
    - conditions: '{{ result_event == ''feed_rejected'' }}'
      sequence:
      - variables:
          notification_title: '{{ feeder_name }} feed rejected'
          notification_message: '{{ feeder_name }} rejected the scheduled request
            for {{ feed_portions | int }} portions.

            '
      - choose:
        - conditions: '{{ error_notify_targets | count > 0 }}'
          sequence:
          - action: notify.send_message
            target:
              entity_id: !input error_notify_targets
            data:
              title: '{{ notification_title }}'
              message: '{{ notification_message }}'
    default:
    - variables:
        notification_title: '{{ feeder_name }} feed unconfirmed'
        notification_message: '{{ feeder_name }} did not confirm the scheduled feed
          before the timeout. Check its connection and feeder state.

          '
    - choose:
      - conditions: '{{ error_notify_targets | count > 0 }}'
        sequence:
        - action: notify.send_message
          target:
            entity_id: !input error_notify_targets
          data:
            title: '{{ notification_title }}'
            message: '{{ notification_message }}'
